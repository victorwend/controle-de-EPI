name: Defeito
description: Registrar um comportamento incorreto de forma reproduzível
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: environment
    attributes:
      label: Ambiente e versão
      placeholder: desenvolvimento, teste, homologação ou produção
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Use dados fictícios e informe a sequência exata.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtido
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Não publique senha, token, biometria ou dados pessoais.
  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      options:
        - Crítica
        - Alta
        - Média
        - Baixa
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto e risco
      description: Informe impacto em estoque, segurança, dados e usuários.
    validations:
      required: true
